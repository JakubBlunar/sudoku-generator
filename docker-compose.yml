# sudoku generator — runs behind the shared Traefik edge proxy.
#
# Deploy:  docker compose up -d --build      (or ./deploy.sh)
# Requires the external "web" network that Traefik sits on (see the chat repo's
# DEPLOYMENT.md, "Adding Another Website"). Traefik auto-discovers this service
# via its labels and auto-issues a Let's Encrypt cert for ${SUDOKU_HOST}.
#
# No public ports: Traefik is the only thing on 80/443 and routes to us.

services:
  sudoku:
    build:
      context: .
      args:
        # og:/twitter: meta origin — derived from the one host below.
        - NEXT_PUBLIC_SITE_URL=https://${SUDOKU_HOST}
    image: sudoku-generator:latest
    restart: unless-stopped
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
    expose:
      - "3000"
    networks:
      - web
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.sudoku.rule=Host(`${SUDOKU_HOST}`)'
      - 'traefik.http.routers.sudoku.entrypoints=websecure'
      - 'traefik.http.routers.sudoku.tls.certresolver=letsencrypt'
      - 'traefik.http.services.sudoku.loadbalancer.server.port=3000'

networks:
  web:
    external: true
